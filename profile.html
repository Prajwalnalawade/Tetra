<form id="profile_form">

<div class="mb-3">
<label class="small mb-1" for="inputUsername">User-Id</label>
<input class="form-control" id="inputUsername" type="text" readonly name="uid" required>
</div>

<div class="row gx-3 mb-3">

<div class="col-md-6">
<label class="small mb-1" for="inputFirstName">First name</label>
<input class="form-control" id="inputFirstName" type="text" placeholder="Enter your first name" name="fname" required>
</div>

<div class="col-md-6">
<label class="small mb-1" for="inputLastName">Last name</label>
<input class="form-control" id="inputLastName" type="text" placeholder="Enter your last name" name="lname" required>
</div>
</div>

<div class="row gx-3 mb-3">

<div class="col-md-6">
<label class="small mb-1" for="inputOrgName">Organization name</label>
<input class="form-control" id="inputOrgName" type="text" placeholder="Enter your organization name" name="organization">
</div>

<div class="row gx-3 mb-3">
<label class="small mb-1" for="inputLocation">Location</label>
<input class="form-control" id="inputLocation" type="text" placeholder="Enter your location" name="location" required>
</div>


<div class="mb-3">
<label class="small mb-1" for="inputEmailAddress">Email address</label>
<input class="form-control" id="inputEmailAddress" type="email" placeholder="Enter your email address" name="email" readonly required>
</div>

<div class="row gx-3 mb-3">
<div class="col-md-6">
<label class="small mb-1" for="inputPhone">Phone number</label>
<input class="form-control" id="inputPhone" type="tel" placeholder="Enter your phone number" required name="phone">
</div>

<div class="col-md-6">
<label class="small mb-1" for="inputBirthday">Birthday (dd/mm/yyyy)</label>
<input class="form-control" id="inputBirthday" type="date" name="birthday" placeholder="Enter your birthday" required>
</div>
</div>

<div class="row gx-3 mb-3">

    <textarea class="form-control" id="inputdetailinfo" type="text" placeholder="Enter About yourself" name="aboutyou" required></textarea>

<button class="btn btn-primary" type="submit">Save changes</button>
